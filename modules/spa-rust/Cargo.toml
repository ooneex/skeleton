[package]
name = "spa-rust"
version = "0.1.0"
edition = "2024"
# Tests live flat in `tests/` as `<source path>_spec.rs` — the source file they cover
# with its folders folded into the name (`src/routes/index.rs` -> `routes_index_spec.rs`).
# Cargo auto-discovers them, so a new spec needs no entry here.

# Both entry points live in `src/bootstrap/`. `main.rs` is the wasm entry point
# `dx` builds — and carries the `dx` config in its doc comment; `lib.rs` keeps the
# routes and components reachable from `cargo test`, which renders them through
# `dioxus-ssr` on the host.
[lib]
name = "spa_rust"
path = "src/bootstrap/lib.rs"

[[bin]]
name = "spa-rust"
path = "src/bootstrap/main.rs"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "web"] }

[dev-dependencies]
dioxus-ssr = "0.7.9"
