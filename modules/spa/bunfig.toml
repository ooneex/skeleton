[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "../**",
  "**/routeTree.gen.ts",
  "**/*.d.ts",
  "e2e/**",
  "public/**",
  "dist/**",
]
# Thresholds are enforced per file, so they are capped by the least-covered file.
coverageThreshold = { lines = 0.9, functions = 0.5, statements = 0.9 }
