[application]
name = "admin-rust"
# Mirrors the `build.outDir` / `publicDir` pair of the TypeScript admin's vite config.
out_dir = "dist"
public_dir = "public"
# `dx` runs the Tailwind CLI over this entry before every build, which is what
# `@tailwindcss/vite` does for the TypeScript admin.
tailwind_input = "src/shared/styles/app.css"
tailwind_output = "assets/app.css"

[web.app]
title = "Ooneex"

[web.watcher]
watch_path = ["src", "public"]
index_on_404 = true
