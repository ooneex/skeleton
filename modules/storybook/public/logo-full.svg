<svg
      width="150"
      height="38"
      viewBox="0 0 150 38"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <!-- Cast-bronze frame: diagonal sheen across the metal -->
        <linearGradient id="frame-l" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9C488" />
          <stop offset="0.5" stop-color="#BB823C" />
          <stop offset="1" stop-color="#6E4517" />
        </linearGradient>
        <!-- Recessed inner panel -->
        <linearGradient id="panel-l" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#241A0E" />
          <stop offset="1" stop-color="#140D07" />
        </linearGradient>
        <!-- Embossed T: bright top highlight into deeper bronze -->
        <linearGradient id="mono-l" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FCE6BE" />
          <stop offset="0.5" stop-color="#E0A559" />
          <stop offset="1" stop-color="#A86C2C" />
        </linearGradient>
        <!-- Verdigris patina inlay -->
        <linearGradient id="patina-l" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5FC1B3" />
          <stop offset="1" stop-color="#2E8C85" />
        </linearGradient>
        <!-- Glossy top sheen -->
        <linearGradient id="gloss-l" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38" />
          <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
        <!-- Metallic wordmark -->
        <linearGradient id="word-l" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A86E2E" />
          <stop offset="1" stop-color="#6E4517" />
        </linearGradient>
      </defs>

      <!-- Emblem -->
      <rect x="0" y="0" width="38" height="38" rx="9" fill="url(#frame-l)" />
      <rect x="0" y="0" width="38" height="20" rx="9" fill="url(#gloss-l)" />
      <rect x="3" y="3" width="32" height="32" rx="6.5" fill="url(#panel-l)" />
      <g fill="url(#mono-l)">
        <rect x="9" y="9.5" width="20" height="4.6" rx="1.4" />
        <rect x="16.7" y="9.5" width="4.6" height="18.5" rx="1.4" />
      </g>
      <rect x="13.5" y="30" width="11" height="2.1" rx="1.05" fill="url(#patina-l)" />

      <!-- Wordmark -->
      <text
        x="50"
        y="26.5"
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.6"
        fill="url(#word-l)"
      >Talos</text>
      <circle cx="124.5" cy="22.5" r="2.6" fill="url(#patina-l)" />
    </svg>
