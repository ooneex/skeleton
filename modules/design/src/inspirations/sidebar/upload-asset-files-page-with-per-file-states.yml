title: "Upload Asset Files Page With Per File States"
description: "An asset upload page in browser chrome: a sidebar with counts and a Go Pro card, a page title with help, settings and filter buttons, a violet-outlined drop zone with a click-to-upload link, supported formats and a PDF being dragged in under a grab cursor, then file rows — uploading with a violet bar and percentage, complete with a green bar and tick, failed with a red bar and a Try Again action, and more still in flight."
