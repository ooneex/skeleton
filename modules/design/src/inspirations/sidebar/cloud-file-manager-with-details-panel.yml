title: "Cloud File Manager With Details Panel"
description: "Drive-style file browser: a folder tree with per-folder counts, a dashed drag-and-drop upload zone, frequently used folder shortcuts and a file table, with a right panel showing a preview, tags, file details, description and collaborators."
