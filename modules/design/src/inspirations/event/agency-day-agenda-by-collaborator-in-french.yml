  - "localization"
  - "scheduling"
  - "day-view"
usage: "use when a day is planned across a large team — one row per person rather than one column, colleagues toggled on and off by colour-keyed checkboxes, appointment type carried by a glyph and rule colour, and open-ended duties drawn as a hatched band."
