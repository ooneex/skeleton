title: "Patient Selection List With Live Count Action"
description: "List-building screen: a page header, a card pairing a unit select with a search-by-name field, a checkbox table of name with avatar, age, MRN and diagnosis where six rows are ticked, and a full-width Save Patients List button whose label carries the live selection count."
