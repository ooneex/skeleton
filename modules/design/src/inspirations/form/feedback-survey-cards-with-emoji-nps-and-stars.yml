title: "Feedback Survey Cards With Emoji NPS And Stars"
description: "Four survey treatments: a satisfaction card with an emoji scale from Awful to Excellent and the chosen face ringed, an optional comment box with a character counter, a consent checkbox and Close and Submit; an NPS card with a zero-to-ten segmented scale anchored at both ends; a compact emoji-only variant; and a five-star rating card."
