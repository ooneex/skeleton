  - "upload"
  - "progress"
  - "error-state"
  - "list"
  - "form"
  - "validation"
  - "queue"
usage: "use when several files upload at once — per-row progress with an estimate, type-specific icons once complete, an inline reason on rejected rows, and Confirm held disabled until the queue resolves."
