  - "marketplace"
  - "slider"
usage: "use when a listing page is driven by a heavy filter panel — a price slider explained by its distribution, boolean facets as a labelled toggle rather than a checkbox, applied filters echoed as removable chips beside the result count, and one attribute pill per card carrying the selling point."
