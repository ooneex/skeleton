title: "Collaboration Components Share Comment And AI Wizard"
description: "Four collaboration components on textured grey: a share popover with an email token field, a public-link row with a permission select and per-member access rows over Copy link and Invite; a comments panel with threaded entries, per-comment reply and emoji actions, a reference number and a composer with Send; a two-step wizard header with a ticked first step over a Describe to AI textarea; and the same wizard on an upload step with two file rows, one complete and one at seventy percent."
