title: "Resume Upload Wizard Step With Per Slot Progress"
description: "Step four of an application flow: numbered step circles with the current one ringed, an illustrated left panel naming the accepted formats, and a right column where each document slot — Resume marked required, CV, Portfolio, Certifications — carries a typed file icon, filename, size, a coloured progress bar and a state action of tick, cancel or red retry, closed by an Others drop zone and a rounded Submit."
