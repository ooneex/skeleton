title: "School Library Dashboard With Book Cards"
description: "A school-management library screen on a lilac gradient: a left sidebar with the wordmark, nine plain nav rows with the active Library marked by a violet bar and icon, and an 'Upgrade to Pro for more facilities' card with an Upgrade button; a header with a Search field, a red 'Live' pill, a moon theme toggle, a bell and an avatar; a violet welcome banner flanked by 3D book illustrations, carrying a greeting, a two-line description and an outlined 'Learn more' button; a 'Popular' shelf with a 'VIEW ALL' link over four cards, each a pastel 3D book still with a bookmark and a heart toggle laid on its lower corners, captioned with a truncated title and a clipped description, and an identical 'Ongoing' shelf beneath; and a right column holding an 'Unlocks achievement' card with a toggle, a one-line status and two learner rows pairing an avatar with a segmented progress bar, an 'N% Achieved' figure and a days-left count, over a 'Best sales' list whose rows pair a product thumbnail with a title, a star rating and a violet Order button."
tags:
