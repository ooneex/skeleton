title: "Transit Journey Itinerary With Line Badges"
description: "A public-transport journey plan on desktop and phone: a vertical itinerary where each leg is a coloured line between station dots, line badges name the service and direction, sublines give duration and stop count behind an expander, walking and change legs carry pictograms, a red warning notes a closed exit and wait time is marked with a clock — with the phone showing the route traced on a map above a sheet repeating the itinerary with duration and fare."
