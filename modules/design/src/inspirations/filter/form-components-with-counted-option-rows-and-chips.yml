title: "Form Components With Counted Option Rows And Chips"
description: "Form controls on mint: a Schedule Checkboxes card pairing From and To time fields with AM/PM segmented toggles above a weekday checkbox list, a blue-outlined stops-duration card whose rows pair a green count badge with a label and a circular check — the selected row solid blue, the rest grey — a Select Chips card with a \"3 selected\" dropdown and tick-marked chips, and described toggle rows."
