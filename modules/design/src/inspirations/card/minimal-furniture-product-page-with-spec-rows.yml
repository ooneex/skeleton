  - "gallery"
  - "breadcrumb"
  - "form"
  - "typography"
  - "minimal"
  - "product"
usage: "use when a product page should read like a catalogue spread — one large image with thumbnails laid over it, specifications as label/value rows rather than a table, and a buy row where the price lives inside the button instead of floating above it."
