title: "Property Listing Card With Agent Call Action"
description: "A rental listing shown as a single card floating over a heavily blurred copy of its own photograph: the card's top third is the property picture, carrying a white 'For Rent' pill led by a blue dot at the lower left and round map and heart buttons at the lower right; beneath it the rent is set large with a '/ years' period in grey, opposite a pill pairing a gold star with a '4.9 / 5.0' rating; under a rule the listing name sits over its full street address, then a row of three glyph-led facts giving bedrooms, bathrooms and a private pool; and a final rule separates an agent strip on a tinted tile that pairs the agent's portrait with their name, a blue verified badge and their phone number, opposite a round mint call button."
tags:
  - "card"
