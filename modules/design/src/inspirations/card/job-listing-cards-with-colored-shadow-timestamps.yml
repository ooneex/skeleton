title: "Job Listing Cards With Colored Shadow Timestamps"
description: "Job cards scattered in perspective on lilac: each pairs a company logo with the role title, a salary range and outlined employment-type chips, and sits on a coloured offset panel whose exposed edge carries the posted-time line."
