title: "Navigation Patterns With Icons Counts And Flags"
description: "Four navigation patterns on white: a country segmented control with flags and a raised white selected pill, a repository tab row where icons lead the labels and Issues carries a count pill, a payment-method chooser of icon-over-label tiles with the selected one on a grey plate, and a category tab row of outline icons over labels with an underline on the active item and one item greyed as disabled."
