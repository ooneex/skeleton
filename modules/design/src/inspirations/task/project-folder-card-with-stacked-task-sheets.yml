title: "Project Folder Card With Stacked Task Sheets"
description: "A project tile on a pale rounded surface: a deep indigo folder drawn in soft 3D with its back panel raised behind, a small progress bar tucked along that back panel's top edge and two white sheets fanning out between back and front to suggest the items filed inside, the front panel a lighter indigo holding one inset chip that pairs a white rounded tile carrying a swimmer emoji with the task 'Swim a lap' in bold white; beneath it a caption pairs the project name with a middle dot, an archive glyph and a '3 tasks' count."
