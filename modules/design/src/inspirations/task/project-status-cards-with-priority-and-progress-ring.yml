title: "Project Status Cards With Priority And Progress Ring"
description: "Four project cards on a pale blue ground, each opening with an outline folder glyph opposite a tinted status pill keyed by its own coloured dot — teal Active, dark Planned, orange Backlog, blue Completed; beneath sits the project name in bold, a one-line brief clipped with an ellipsis, then a meta line pairing a person glyph with the client and, after a middle dot, the engagement type and its length; a second line pairs a flag glyph with the due date opposite a priority read from a small bar chart whose bars fill in proportion to High, Medium or Low; and under a rule a footer pairs a part-filled pie ring with its percentage, a checklist glyph with a 'done / total Tasks' count and the owner's avatar."
tags:
  - "card"
  - "project-management"
  - "status-pill"
  - "progress"
  - "task"
  - "grid"
  - "priority"
  - "closeup"
usage: "use when a portfolio is browsed as cards — state as a dotted pill, priority drawn as filled bars rather than written twice, and completion given both as a ring and as a task count so proportion and absolute progress read together."
