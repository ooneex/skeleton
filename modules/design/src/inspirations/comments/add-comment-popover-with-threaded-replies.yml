title: "Add Comment Popover With Threaded Replies"
description: "A compact comment popover: a titled header with a close button, threaded comments with pixel-art avatars, verified ticks and relative timestamps joined by a reply guide line, a composer row pairing the current user's avatar with a round send button, and a floating toolbar of emoji, attachment and AI actions beside a keyboard-dismiss control."
