title: "Glass Folder Icon With Layered Colour Sheets"
description: "A single folder icon centred on an off-white ground: a frosted, translucent shell with a softly rounded body and a raised tab, its front face washed with a pink-to-white gradient and lit by a bright vertical highlight down each edge, behind which four thin coloured sheets — blue, green, amber and red — peek above the rim in even bands, the whole object thickened with a glassy white outline and set down on a wide, low-contrast drop shadow."
