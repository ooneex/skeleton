title: "Flat Folder Icon Set In Four Colours"
description: "An icon sheet captioned 'Folder Icon' showing the same flat folder mark drawn four times in yellow, light blue, magenta and purple: each folder is a two-tone shape whose darker back panel rises behind a lighter front flap, with a white document sheet protruding from the top carrying a few blue ruled lines to suggest text, and three fine lines along the bottom edge implying stacked pages inside — the whole set built without outlines, gradients or shadows so the colour alone distinguishes one folder from another."
