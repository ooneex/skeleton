title: "Download Folder Icon Flat And 3D Variants"
description: "Two versions of the same pink download-folder icon side by side on a pale lilac ground: the left one is flat, a two-tone folder whose darker tab sits behind a lighter front panel with a soft translucent circle carrying a white downward arrow; the right one is the same silhouette rendered in three dimensions, with rounded bevelled edges, a gradient front panel, a saturated magenta circle behind the arrow and a soft drop shadow beneath, so the pair reads as one mark at two levels of depth."
