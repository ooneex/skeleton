title: "Flat Folder And File Type Icon Set With Badges"
description: "An icon sheet on white, arranged in two rows. The top row holds three flat folder marks in pink, blue and amber, each a plain rounded folder with a tab: the pink one carries a faint watermarked glyph and is captioned 'Shared with me', while the blue and amber ones each carry a translucent count pill reading the number of files above a smaller 'N collaborators' line, captioned with their folder names. The bottom row holds three file marks in amber, blue and pink, each a rounded sheet with a folded top-right corner and a translucent extension pill — .JPG, .PSD, .PDF — centred on it, captioned with the filename beneath."
tags:
