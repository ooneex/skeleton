title: "File Manager And Kanban Board Pair"
description: "Two overlapping screens: a file manager with per-provider storage donuts for Dropbox, Drive, OneDrive and iCloud, a category rail, a breadcrumb with list and grid toggles and a file table; and a kanban headed by a project title, member avatars and Invite, with five columns of tagged cards and one card lifted mid-drag."
