title: "Sales Statistics Cards With Visitor Attribution Ring"
description: "A store analytics group: three KPI cards each with a rounded coloured icon tile and a signed weekly change, a Sales statistics area chart with a year select, a headline total with growth and a dark point tooltip naming date and value, and a Recent month card whose segmented ring attributes visitors to social media, purchased, affiliate and advertising in a percentage legend."
