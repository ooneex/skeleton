title: "Ecommerce Insight Page With Cohort Retention Grid"
description: "A commerce insight page in browser chrome: a sidebar with Create New and a pro upsell, a This Week with Compare to Last Week control plus Customize Widget and Export Data, three metric cards each pairing a value and signed change with a two-line chart against a dashed prior period, a Conversion Rate funnel of stages with session counts and changes, a Sessions bar chart, and a Customer Cohort Analysis retention grid shaded by value."
