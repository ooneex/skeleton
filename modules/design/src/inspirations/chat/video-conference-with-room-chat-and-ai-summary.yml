  - "conference"
  - "captions"
  - "ai"
  - "interaction"
usage: "use when a call must carry its side conversation and its record at once — an active speaker with captions, a filmstrip that still shows camera-off people, split device buttons whose chevron picks the source, and a chat and running AI summary docked beside the video rather than hidden behind it."
