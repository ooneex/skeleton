  - "filter"
  - "project-management"
usage: "use when a list of automations must be monitored and acted on in bulk — counts framed as N-of-total, an alert card that names the failure and offers the fix, a selection count that stays visible in the toolbar, and a per-row toggle so enabling never needs a detail page."
