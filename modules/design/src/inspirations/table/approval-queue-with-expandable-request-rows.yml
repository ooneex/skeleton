  - "list"
  - "table"
  - "expandable"
  - "pagination"
  - "workflow"
  - "gauge"
  - "sidebar"
usage: "use when a queue row must stay compact until it is the focus — collapsed rows showing only the identifying values, and the selected row expanding to label every field without leaving the list."
