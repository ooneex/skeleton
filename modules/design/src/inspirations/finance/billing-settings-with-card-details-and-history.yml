title: "Billing Settings With Card Details And History"
description: "A billing settings tab: a sidebar with counted tasks and activities, recent projects and a light/dark toggle by the user footer, a settings tab strip, a Payment Method section with card name, expiry, brand-marked number and CVV fields plus Add another card, a Contact email radio choice between the existing address and a new one, and a Billing History checkbox table with sortable invoice, date, amount, coloured status pills and a tracking number over its address."
