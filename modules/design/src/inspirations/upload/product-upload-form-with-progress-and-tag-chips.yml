title: "Product Upload Form With Progress And Tag Chips"
description: "A product creation screen: a sidebar, search and seller chip, an Add Images card with a dashed drop zone and thumbnail rows carrying sizes and delete buttons plus an in-progress row showing percentage, transfer speed and a red Cancel, and a right form of name, category and sub-category selects, price, description and removable tag chips with one selected in blue, over Publish Product."
