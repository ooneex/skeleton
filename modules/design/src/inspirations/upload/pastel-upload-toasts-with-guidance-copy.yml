title: "Pastel Upload Toasts With Guidance Copy"
description: "Two upload toasts on deep teal: a mint success stating the files uploaded and when the review results will arrive, and a rose error stating the files exceed five megabytes with advice to compress and retry — each with a large white circular icon disc, a bold headline over a two-line explanation, a grey dismiss cross and soft overlapping blobs textured into the left edge."
tags:
