title: "Glass Context Menu With Shortcuts And Submenus"
description: "A single frosted-glass context menu centred on a deep blue-to-teal gradient: a translucent rounded panel with a fine light border, divided by hairlines into three groups — 'New Frame' with its ⌘N shortcut; Copy and 'Past', where the hovered Copy row is drawn as a lighter filled lozenge and both show ⌘ shortcuts; and 'Select layer', 'Hide layer' with a two-key shortcut, 'Move to page' and 'Plugins' — every row pairing a thin white outline icon with its label, and the rows that open submenus ending in a chevron instead of a shortcut."
