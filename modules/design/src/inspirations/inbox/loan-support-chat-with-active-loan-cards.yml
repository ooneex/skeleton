title: "Loan Support Chat With Active Loan Cards"
description: "A lending support console on a yellow patterned ground: a dark green sidebar with the wordmark and seven nav rows, the active 'Open Conversations' in yellow; a header pairing the page title with a Search field and a named avatar; a conversation column with a 'Search Conversation' field, rows pairing a portrait with the correspondent's name, a repeated 'Hey, Need a Help' preview and a timestamp, unread rows marked by a red dot and a bolder name with the open one tinted mint, and a full-width yellow 'Start New Chat' button pinned at its foot; a transcript headed by the correspondent's portrait, name and job title with an overflow, holding incoming white bubbles and own mint bubbles each labelled with the sender and time — one carrying a 'Seen at' receipt and another three photo attachments in a row — over a composer pairing the user's avatar with a 'Type your message here' field; and a right 'Active Loans' column of cards, each pairing the product name and lender with the bank's real logo, a bordered block splitting Amount, 'Monthly Instalment', Rate and Duration into four labelled figures, and a star-led endorsement line, the second card also carrying an amber 'Almost Repaid' pill."
tags:
