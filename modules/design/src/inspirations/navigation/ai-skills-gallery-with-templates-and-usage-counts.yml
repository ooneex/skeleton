title: "AI Skills Gallery With Templates And Usage Counts"
description: "A marketing-AI workspace shown on a tablet: a left sidebar with the wordmark, a Search field, a nav list of collapsible sections — Dashboard, Research, Practice, an expanded Execute revealing indented children with the active 'Upload calls & emails' row in a grey pill, and Measure — then Notification and Settings, and a user card with avatar, name, email and a sign-out button; a page title over an 'Explore Replicate lab templates' panel with a 'Show more' disclosure, holding three template cards that each pair a square illustration with a bold name and a two-line explanation; and a 'Skills (19)' section with 'Owned by anyone' and 'Popular' selects, over a five-column card grid whose first tile is a dashed 'Create Skill' card with a '+' button and whose others centre a circular illustration with a small author avatar overlapping its edge, a wrapped skill name and a 'Used N times' count, each carrying an overflow menu, with the last row clipped by the fold."
