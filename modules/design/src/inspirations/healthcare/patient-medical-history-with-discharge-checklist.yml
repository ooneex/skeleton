title: "Patient Medical History With Discharge Checklist"
description: "Clinical history screen: a patient switcher strip of avatars each labelled with a condition, plus an add button and a see-all count, a key-value band of name, age, sex, code, department, city, diagnosis and treatment, a left column of admission date, a dated event timeline, a discharge-barrier checklist with completed items struck through, past history, medications and abnormal labs, and a records table pairing body areas with symptom lines marked by red and green icons."
