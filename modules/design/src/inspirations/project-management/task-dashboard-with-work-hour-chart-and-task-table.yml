  - "sidebar"
  - "tabs"
usage: "use when a work dashboard must summarise, schedule and list in one screen — a proportion bar backed by a legend that quantifies every state, a chart comparing today against the average, and a task table sitting under a switcher that offers the same data as Gantt, calendar or kanban."
