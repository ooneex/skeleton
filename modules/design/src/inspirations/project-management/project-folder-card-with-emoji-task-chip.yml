title: "Project Folder Card With Emoji Task Chip"
description: "A single project tile on a pale rounded surface: a deep indigo folder rendered in soft 3D with a raised tab, a lighter front panel and a fine highlight along its top edge, holding one inset chip pressed into the panel that pairs a white rounded tile carrying a swimmer emoji with the task 'Swim a lap' set in bold white; beneath the folder a caption line reads the project name in dark ink, then a middle dot, then a grey 'No tasks'."
tags:
