title: "Pagination Component Variants"
description: "Five pagination treatments stacked on one card: a full bar with a go-to-page input, rows-per-page select and first, previous, next and last chevrons around numbered pages with an ellipsis; a Previous/Next bar with centred numbers; a minimal Previous/Next with a per-page select; a joined segmented control; and a compact showing-page bar."
